<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0e1015">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		:root {
			--bg: #0e1015;
			--fg: #e6ebf5;
			--muted: #7b8699;
			--gold: #f2cf6b;
			--line: #232a38;
		}

		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			color: var(--fg);
			background-color: var(--bg);
			overflow: hidden;
			touch-action: none;
			font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		/* 加载层：铺满全屏，引擎起来后整块移除 */
		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background: radial-gradient(circle at 50% 42%, #1a2030 0%, var(--bg) 62%);
			z-index: 10;
		}

		#status .title {
			font-size: clamp(26px, 6vw, 44px);
			font-weight: 700;
			letter-spacing: 0.24em;
			color: var(--gold);
			text-indent: 0.24em;
			/* 字距用 letter-spacing 加，末尾会多一份，用 text-indent 抵掉 */
		}

		#status .subtitle {
			margin-top: 14px;
			font-size: clamp(12px, 2.4vw, 15px);
			letter-spacing: 0.18em;
			color: var(--muted);
			text-indent: 0.18em;
		}

		#status-progress {
			appearance: none;
			-webkit-appearance: none;
			width: min(320px, 62vw);
			height: 4px;
			margin-top: 34px;
			border: 0;
			border-radius: 2px;
			background-color: var(--line);
			color: var(--gold);
			overflow: hidden;
		}

		#status-progress::-webkit-progress-bar {
			background-color: var(--line);
			border-radius: 2px;
		}

		#status-progress::-webkit-progress-value {
			background-color: var(--gold);
			border-radius: 2px;
			transition: width 0.2s linear;
		}

		#status-progress::-moz-progress-bar {
			background-color: var(--gold);
			border-radius: 2px;
		}

		#status-percent {
			margin-top: 12px;
			font-size: 12px;
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.1em;
			color: var(--muted);
			min-height: 1em;
		}

		#status-hint {
			position: absolute;
			bottom: max(22px, env(safe-area-inset-bottom));
			font-size: 12px;
			color: var(--muted);
			text-align: center;
			padding: 0 20px;
			line-height: 1.7;
		}

		/* 错误层：加载失败或浏览器不支持时出现，必须让人看懂而不是黑屏 */
		#status-notice {
			display: none;
			max-width: 520px;
			margin: 0 24px;
			padding: 20px 22px;
			background-color: #2a1418;
			border: 1px solid #7d2b33;
			border-radius: 10px;
			font-size: 14px;
			line-height: 1.75;
			color: #ffd9dc;
			text-align: center;
			white-space: pre-wrap;
			word-break: break-word;
			z-index: 1;
		}

		#status.notice .title,
		#status.notice .subtitle,
		#status.notice #status-progress,
		#status.notice #status-percent,
		#status.notice #status-hint {
			display: none;
		}

		#status.notice #status-notice {
			display: block;
		}

		/* 竖屏提示：手机竖着拿时 16:9 的画面会被压得很小，先劝一句 */
		#rotate {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 20;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 16px;
			background: var(--bg);
			color: var(--fg);
			font-size: 15px;
			letter-spacing: 0.1em;
			text-align: center;
			padding: 24px;
		}

		#rotate .icon {
			width: 46px;
			height: 74px;
			border: 2px solid var(--gold);
			border-radius: 8px;
			animation: tilt 1.8s ease-in-out infinite;
		}

		@keyframes tilt {
			0%, 40% { transform: rotate(0deg); }
			70%, 100% { transform: rotate(90deg); }
		}

		@media (orientation: portrait) and (max-width: 820px) {
			#rotate {
				display: flex;
			}
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>

<body>
	<canvas id="canvas">
		你的浏览器不支持 canvas 标签，请更换浏览器。
	</canvas>

	<noscript>
		你的浏览器禁用了 JavaScript，游戏无法运行。
	</noscript>

	<div id="rotate">
		<div class="icon"></div>
		<div>请横屏游玩</div>
	</div>

	<div id="status">
		<div class="title">暗夜幸存者</div>
		<div class="subtitle">幸存者 · 自动战斗</div>
		<progress id="status-progress"></progress>
		<div id="status-percent"></div>
		<div id="status-hint">首次加载需要下载约 6MB 数据（已压缩）<br>之后会走浏览器缓存</div>
		<div id="status-notice"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusPercent = document.getElementById('status-percent');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;

			// 浏览器不支持 WebGL2 时，引擎会抛异常；提前给一句人话，别让人对着黑屏猜
			function checkWebGL2() {
				try {
					const probe = document.createElement('canvas');
					return !!(probe.getContext('webgl2') || probe.getContext('webgl'));
				} catch (e) {
					return false;
				}
			}

			function displayFailureNotice(err) {
				console.error(err);
				let msg = '游戏启动失败。\n';
				if (!checkWebGL2()) {
					msg += '你的浏览器没有启用 WebGL2。\n请换用 Chrome / Edge / Firefox 的较新版本，或在设置中开启硬件加速。';
				} else if (typeof err === 'string') {
					msg += err;
				} else if (err instanceof Error) {
					msg += err.message;
				} else {
					msg += '未知错误，请刷新页面重试。';
				}
				statusNotice.textContent = msg;
				statusOverlay.classList.add('notice');
				initializing = false;
			}

			function finishLoading() {
				if (!initializing) {
					return;
				}
				initializing = false;
				statusOverlay.remove();
			}

			if (!checkWebGL2()) {
				displayFailureNotice('缺少 WebGL2 支持。');
				return;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});

			if (missing.length !== 0) {
				displayFailureNotice('当前浏览器缺少运行所需的特性：\n' + missing.join('\n'));
				return;
			}

			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
						statusPercent.textContent = Math.floor(current / total * 100) + '%';
					} else {
						// 引擎初始化阶段没有总量，进度条改为不确定态
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
						statusPercent.textContent = '正在启动引擎…';
					}
				},
			}).then(finishLoading, displayFailureNotice);
		}());
	</script>
</body>

</html>
