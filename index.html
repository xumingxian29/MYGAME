<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0e1015">
	<title>MY GAME</title>
	<style>
		:root {
			--bg: #0e1015;
			--fg: #e6ebf5;
			--muted: #7b8699;
			--gold: #f2cf6b;
			--line: #232a38;
		}

		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		html {
			background-color: var(--bg);
			/* 旋转时浏览器会先把视口拉长再重排，铺上底色就不会闪一帧白 */
		}

		body {
			color: var(--fg);
			background-color: var(--bg);
			overflow: hidden;
			touch-action: none;
			-webkit-text-size-adjust: 100%;
			font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		/* 尺寸由 Godot 自己维护（canvas_resize_policy=2 时它按 innerWidth 写行内宽高），
		   这里只保证它不会因为布局流而位移或出现滚动条 */
		#canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			background-color: var(--bg);
		}

		#canvas:focus {
			outline: none;
		}

		/* 加载层：标题居中，进度条单独固定在下方（见 #loadbar） */
		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background: radial-gradient(circle at 50% 42%, #1a2030 0%, var(--bg) 62%);
			z-index: 10;
		}

		#status .title {
			font-size: clamp(26px, 6vw, 44px);
			font-weight: 700;
			letter-spacing: 0.24em;
			color: var(--gold);
			text-indent: 0.24em;
			/* 字距用 letter-spacing 加，末尾会多一份，用 text-indent 抵掉 */
		}

		#status .subtitle {
			margin-top: 14px;
			font-size: clamp(12px, 2.4vw, 15px);
			letter-spacing: 0.18em;
			color: var(--muted);
			text-indent: 0.18em;
		}

		/* 加载进度坞：固定贴底，横竖屏都在屏内。
		   之前进度条是 #status 的 flex 子项，竖屏时 16:9 的画面被压成一条，
		   居中排版把进度条挤到了视口外，玩家看到的就是"一直黑屏没反应"。 */
		#loadbar {
			position: fixed;
			bottom: 12%;
			left: 50%;
			transform: translateX(-50%);
			width: min(320px, 72vw);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
			/* 比竖屏提示层更高：竖屏时提示语盖住全屏，进度条仍要露出来 */
			z-index: 30;
			pointer-events: none;
			text-align: center;
		}

		#status-hint {
			font-size: 12px;
			color: var(--muted);
			line-height: 1.7;
			/* 竖屏底下是提示层，这行说明反而添乱 */
		}

		#status-progress {
			appearance: none;
			-webkit-appearance: none;
			width: 100%;
			height: 4px;
			margin: 0;
			border: 0;
			border-radius: 2px;
			background-color: var(--line);
			color: var(--gold);
			overflow: hidden;
		}

		#status-progress::-webkit-progress-bar {
			background-color: var(--line);
			border-radius: 2px;
		}

		#status-progress::-webkit-progress-value {
			background-color: var(--gold);
			border-radius: 2px;
			transition: width 0.2s linear;
		}

		#status-progress::-moz-progress-bar {
			background-color: var(--gold);
			border-radius: 2px;
		}

		#status-percent {
			font-size: 12px;
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.1em;
			color: var(--muted);
			min-height: 1em;
		}

		/* 错误层：加载失败或浏览器不支持时出现，必须让人看懂而不是黑屏 */
		#status-notice {
			display: none;
			max-width: 520px;
			margin: 0 24px;
			padding: 20px 22px;
			background-color: #2a1418;
			border: 1px solid #7d2b33;
			border-radius: 10px;
			font-size: 14px;
			line-height: 1.75;
			color: #ffd9dc;
			text-align: center;
			white-space: pre-wrap;
			word-break: break-word;
			z-index: 1;
		}

		#status.notice .title,
		#status.notice .subtitle {
			display: none;
		}

		#status.notice #status-notice {
			display: block;
		}

		/* 出错时把进度坞和竖屏提示一起收起，否则最关键的报错被盖在最底下 */
		body.notice #loadbar,
		body.notice #rotate {
			display: none;
		}

		/* 竖屏层：手机竖着拿时先劝一句，别让人对着一条被压扁的画面猜 */
		#rotate {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 20;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 6px;
			padding: 28px 24px 38%;
			box-sizing: border-box;
			background: var(--bg);
			color: var(--fg);
			text-align: center;
			/* 铺满全屏且不透明：竖屏时玩家只该看到这一句话 */
		}

		#rotate .icon-wrap {
			width: 92px;
			height: 92px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 18px;
		}

		#rotate .icon {
			width: 44px;
			height: 76px;
			border: 2px solid var(--gold);
			border-radius: 9px;
			position: relative;
			animation: tilt 2.2s ease-in-out infinite;
			transform-origin: 50% 50%;
		}

		/* 手机底部的横条：让这个方框一眼是"手机"而不是"空矩形" */
		#rotate .icon::after {
			content: "";
			position: absolute;
			left: 50%;
			bottom: 6px;
			width: 14px;
			height: 2px;
			margin-left: -7px;
			border-radius: 1px;
			background-color: var(--gold);
			opacity: 0.7;
		}

		#rotate .headline {
			font-size: clamp(21px, 6.6vw, 34px);
			font-weight: 700;
			letter-spacing: 0.1em;
			text-indent: 0.1em;
			color: var(--fg);
		}

		#rotate .subline {
			margin-top: 12px;
			font-size: clamp(12px, 3.2vw, 15px);
			line-height: 1.7;
			color: var(--muted);
			letter-spacing: 0.06em;
		}

		#rotate .tip {
			margin-top: 22px;
			font-size: 13px;
			color: var(--gold);
			letter-spacing: 0.08em;
			font-variant-numeric: tabular-nums;
			min-height: 1em;
		}

		@keyframes tilt {
			0%, 34% { transform: rotate(0deg); }
			66%, 100% { transform: rotate(90deg); }
		}

		/* 竖屏判定：触屏设备一律算；桌面浏览器把窗口拖成竖的也算（宽到 820px 以上就不管了，
		   那种窗口里的画面还是能玩的，不该被一句"请把手机横过来"挡住） */
		@media (orientation: portrait) and (pointer: coarse),
			(orientation: portrait) and (max-width: 820px) {
			#rotate {
				display: flex;
			}

			/* 竖屏时下方是提示层，说明文字会叠在提示语上 */
			#status-hint {
				display: none;
			}
		}

		/* 短屏（手机横过来后可用高度只有 300~400px）：把标题压小一点，
		   否则标题 + 底部进度坞在 320px 高的屏上会挤在一起 */
		@media (orientation: landscape) and (max-height: 420px) {
			#status .title {
				font-size: 24px;
			}

			#status .subtitle {
				margin-top: 8px;
			}

			#loadbar {
				bottom: max(10%, 44px);
			}

			#status-hint {
				display: none;
			}
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>

<body>
	<canvas id="canvas">
		你的浏览器不支持 canvas 标签，请更换浏览器。
	</canvas>

	<noscript>
		你的浏览器禁用了 JavaScript，游戏无法运行。
	</noscript>

	<!-- 竖屏提示层：默认隐藏，横屏后自动消失（纯 CSS 判定，引擎还在下载时就能生效） -->
	<div id="rotate" role="status" aria-live="polite">
		<div class="icon-wrap">
			<div class="icon"></div>
		</div>
		<div class="headline">请把手机横过来</div>
		<div class="subline">竖屏会把 16:9 的画面压扁<br>横屏才是完整体验</div>
		<div class="tip" id="rotate-percent">正在启动引擎…</div>
	</div>

	<div id="status">
		<div class="title">暗夜幸存者</div>
		<div class="subtitle">幸存者 · 自动战斗</div>
		<div id="status-notice"></div>
	</div>

	<!-- 进度坞独立于 #status：它固定贴底，任何方向、任何画面比例都在屏内 -->
	<div id="loadbar">
		<div id="status-hint">首次加载约 6MB（已压缩），之后走浏览器缓存</div>
		<progress id="status-progress"></progress>
		<div id="status-percent"></div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":1670904,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusPercent = document.getElementById('status-percent');
			const statusNotice = document.getElementById('status-notice');
			const rotatePercent = document.getElementById('rotate-percent');
			const rotateHeadline = document.querySelector('#rotate .headline');
			const rotateSubline = document.querySelector('#rotate .subline');

			let initializing = true;
			/* 引擎是否已经起来了。竖屏层的文案要分两档：
			   加载中不能写"已暂停"（那时游戏还没开始），加载完才说暂停。 */
			let loaded = false;

			/* ---------------- 竖屏暂停 ----------------
			   判定条件必须和 CSS 里 #rotate 的显示条件逐字一致，
			   否则会出现"没显示竖屏提示、但游戏被暂停了"这种哑巴状态。
			   竖着把桌面浏览器窗口拖窄（宽度 > 820 的设备）不会触发暂停。 */
			const portraitQuery = window.matchMedia(
				'(orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 820px)'
			);

			/* 引擎回写过来的状态（JSON 字符串）。用 accessor 拦截赋值，
			   这样引擎一改状态，竖屏层的文案立刻跟着变，不用轮询。 */
			let nsStateRaw = '';
			Object.defineProperty(window, '__nsState', {
				configurable: true,
				get: function () { return nsStateRaw; },
				set: function (value) {
					nsStateRaw = value;
					refreshRotateCopy();
				},
			});

			function readNsState() {
				try {
					return JSON.parse(nsStateRaw || '{}');
				} catch (e) {
					return {};
				}
			}

			/* 竖屏层文案：加载中说"横过来"，加载后说"已暂停/请横屏继续"。
			   state 是 Godot 的 State 枚举：0 MENU / 1 PLAYING / 2 LEVEL_UP / 3 GAME_OVER */
			function refreshRotateCopy() {
				if (!loaded || !rotateHeadline) {
					return;
				}
				const state = readNsState().state;
				const playing = state === 1 || state === 2;
				rotateHeadline.textContent = playing ? '已暂停' : '请横屏继续';
				if (rotateSubline) {
					rotateSubline.innerHTML = playing
						? '竖屏时游戏会自动暂停<br>横过来接着打'
						: '竖屏会把 16:9 的画面压扁';
				}
			}

			/* 把"外部打断"推给引擎。两类原因共用一条通道：
			     'portrait' 竖屏、'hidden' 切后台/锁屏。
			   引擎那边是一个原因集合，两个同时成立时解除一个也不会误恢复。
			   引擎还没起来时 window.__nsPause 不存在，这一下是空操作——
			   它 _ready 之后会通过 __nsResync 主动要一次。 */
			function reportPause(reason, on) {
				if (typeof window.__nsPause === 'function') {
					window.__nsPause(reason, on ? 1 : 0);
				}
				document.documentElement.dataset.paused = on ? '1' : '';
			}

			let lastPortrait = null;
			function syncPortrait(portrait) {
				if (portrait === lastPortrait) {
					return;
				}
				lastPortrait = portrait;
				reportPause('portrait', portrait);
			}

			/* 切标签页 / 切应用 / 锁屏。用 visibilitychange 而不是 blur：
			   桌面点一下地址栏也会 blur，但页面还看得见，那时暂停只会让人莫名其妙。 */
			let lastHidden = null;
			function syncHidden(hidden) {
				if (hidden === lastHidden) {
					return;
				}
				lastHidden = hidden;
				reportPause('hidden', hidden);
			}
			document.addEventListener('visibilitychange', function () {
				syncHidden(document.hidden);
			});
			// 移动端切后台有时只有 pagehide、回来只有 pageshow（甚至走 bfcache）
			window.addEventListener('pagehide', function () {
				syncHidden(true);
			});
			window.addEventListener('pageshow', function () {
				syncHidden(document.hidden);
			});

			/* 引擎 _ready 会调这个：清掉去重缓存，把当前所有原因重推一遍。 */
			window.__nsResync = function () {
				lastPortrait = null;
				lastHidden = null;
				syncPortrait(portraitQuery.matches);
				syncHidden(document.hidden);
			};

			/* ---------------- 视口同步（旋转 / 改窗口） ---------------- */

			// Godot 的 canvas 尺寸与 content_scale 都挂在它自己的 resize 链路上
			// （updateSize() 每帧读 window.innerWidth）。所以"重算"最可靠的办法
			// 不是我们去改 canvas，而是让引擎再走一遍自己的 resize 流程。
			// 用标志位挡住自派发，避免"派发 → 触发监听 → 再派发"的死循环。
			let selfDispatch = false;
			let settleTimer = 0;

			function pushResize() {
				selfDispatch = true;
				try {
					window.dispatchEvent(new Event('resize'));
				} finally {
					selfDispatch = false;
				}
			}

			function applyViewport() {
				const portrait = window.innerHeight > window.innerWidth;
				document.documentElement.dataset.orientation = portrait ? 'portrait' : 'landscape';
				// 暂停判定走媒体查询而不是上面这个布尔值：桌面把窗口拖成竖的
				// （宽度 > 820）画面照样能玩，不该弹提示也不该暂停。
				syncPortrait(portraitQuery.matches);
				// 只做"通知"，不直接改 canvas 尺寸：Godot 自己按 innerWidth 重排，
				// 我们插手会跟它的 hidpi 缩放打架（画布尺寸对不上会糊或留白）。
				pushResize();
			}

			function scheduleViewportSync() {
				window.clearTimeout(settleTimer);
				applyViewport();
				// 旋转动画期间读到的尺寸可能还是旧的（iOS 尤其明显）：
				// 320ms 后按最终尺寸再补一次，这是"转过来黑一下/留白"的主因。
				settleTimer = window.setTimeout(applyViewport, 320);
			}

			window.addEventListener('resize', function () {
				if (selfDispatch) {
					return;
				}
				scheduleViewportSync();
			}, { passive: true });

			window.addEventListener('orientationchange', function () {
				scheduleViewportSync();
				// 老版本 iOS 的 innerWidth 会拖到下一次布局才更新，多补一拍
				window.setTimeout(applyViewport, 700);
			});

			if (window.visualViewport) {
				window.visualViewport.addEventListener('resize', function () {
					if (selfDispatch) {
						return;
					}
					scheduleViewportSync();
				}, { passive: true });
			}

			// 媒体查询自己有 change 事件，比 orientationchange 更早也更准
			// （后者在部分安卓 WebView 上要等旋转动画结束才触发）
			if (typeof portraitQuery.addEventListener === 'function') {
				portraitQuery.addEventListener('change', function () {
					syncPortrait(portraitQuery.matches);
				});
			}

			applyViewport();

			/* ---------------- 加载流程 ---------------- */

			// 浏览器不支持 WebGL2 时，引擎会抛异常；提前给一句人话，别让人对着黑屏猜
			function checkWebGL2() {
				try {
					const probe = document.createElement('canvas');
					return !!(probe.getContext('webgl2') || probe.getContext('webgl'));
				} catch (e) {
					return false;
				}
			}

			function displayFailureNotice(err) {
				console.error(err);
				let msg = '游戏启动失败。\n';
				if (!checkWebGL2()) {
					msg += '你的浏览器没有启用 WebGL2。\n请换用 Chrome / Edge / Firefox 的较新版本，或在设置中开启硬件加速。';
				} else if (typeof err === 'string') {
					msg += err;
				} else if (err instanceof Error) {
					msg += err.message;
				} else {
					msg += '未知错误，请刷新页面重试。';
				}
				statusNotice.textContent = msg;
				statusOverlay.classList.add('notice');
				// 报错必须能被看见：竖屏提示层和进度坞一起收起（CSS 里也有同样的规则，
				// 这里再标一次是因为竖屏提示层靠媒体查询显示，行内样式更硬）
				document.body.classList.add('notice');
				initializing = false;
			}

			function finishLoading() {
				if (!initializing) {
					return;
				}
				initializing = false;
				loaded = true;
				statusOverlay.remove();
				const loadbar = document.getElementById('loadbar');
				if (loadbar) {
					loadbar.remove();
				}
				// 竖屏提示层可能还在：加载完了，文案从"正在启动"换成"已暂停"。
				// 这一句必须放在 loaded = true 之后——refreshRotateCopy 会读它。
				if (rotatePercent) {
					rotatePercent.textContent = '横屏即可继续';
				}
				refreshRotateCopy();
			}

			if (!checkWebGL2()) {
				displayFailureNotice('缺少 WebGL2 支持。');
				return;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});

			if (missing.length !== 0) {
				displayFailureNotice('当前浏览器缺少运行所需的特性：\n' + missing.join('\n'));
				return;
			}

			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
						const pct = Math.floor(current / total * 100);
						statusPercent.textContent = pct + '%';
						// 竖屏时进度坞在提示层之上（看得出来），但加一行文字更保险：
						// 有些浏览器会把 fixed 元素挡在软键盘/工具栏后面
						if (rotatePercent) {
							rotatePercent.textContent = '正在加载 ' + pct + '%';
						}
					} else {
						// 引擎初始化阶段没有总量，进度条改为不确定态
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
						statusPercent.textContent = '正在启动引擎…';
						if (rotatePercent) {
							rotatePercent.textContent = '正在启动引擎…';
						}
					}
				},
			}).then(finishLoading, displayFailureNotice);
		}());
	</script>
</body>

</html>
